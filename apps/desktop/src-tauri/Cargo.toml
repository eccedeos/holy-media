[package]
name = "holy-media"
version = "0.0.1"
description = "Software de projecao para igrejas"
authors = ["Holy Media"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

# O binario e a lib compartilham o mesmo nucleo: a lib e' o ponto de entrada
# real (e o que os testes exercitam), o binario apenas a chama.
[lib]
name = "holy_media_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Ativado pelo `tauri dev`/`tauri build` quando ha custom protocol.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Requisito de leveza (secao 20): binario menor e sem simbolos de debug.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
